name: Gigya
description: Gigya is a customer identity and access management (CIAM) platform, acquired by SAP in 2017
  and now delivered as SAP Customer Data Cloud. It provides Registration-as-a-Service (RaaS), social and
  passwordless login, progressive profiling, consent and preference management, and a unified customer
  profile store, exposed through a data-center-scoped REST API (accounts, socialize, ds, and related services
  under accounts.{dc}.gigya.com). Developers integrate via first-party SDKs for Web, iOS/Swift, Android,
  Flutter, React Native, and server-side Java, PHP, Python, and .NET, authenticating with a site API key
  plus signed application/user secrets or OAuth 2.0 client-credentials tokens. Originally a Mayfield-backed
  venture, Gigya's technology now underpins SAP's customer data and identity offering.
